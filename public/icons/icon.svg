<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Divvy">
  <!--
    Two people, one line between them: what the app draws everywhere else.
    Ink square, a paper-coloured curve, and two dots in person colours (azure
    and coral). Kept to three shapes so it still reads at 16px.
  -->
  <rect width="512" height="512" rx="114" fill="#141412"/>
  <path d="M150 318 C 196 160, 316 352, 362 194" fill="none" stroke="#fafaf8" stroke-width="30" stroke-linecap="round"/>
  <circle cx="146" cy="330" r="58" fill="#60b2f5"/>
  <circle cx="366" cy="182" r="58" fill="#f0898a"/>
</svg>
