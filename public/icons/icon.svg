    <path d="M128 148h94c62 0 106 42 106 108s-44 108-106 108h-94a12 12 0 0 1-12-12V160a12 12 0 0 1 12-12Zm60 60v96h34c30 0 48-19 48-48s-18-48-48-48h-34Z"/>
