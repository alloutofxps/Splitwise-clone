name: Nightly

# The checks too long for every change (RULES V1, V2; findings item 17): bad
# input at every route, about 30,000 calls and half an hour. Once a day on
# main, and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      DATABASE_URL: file:./dev.db
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real
      # Every allowance times 1,000, so the calls test validation, not the
      # rate limits.
      DIVVY_RATE_LIMIT_SCALE: "1000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      # Every route and method, signed out and in, with junk in the path, the
      # query and the body: never a 500, nothing internal in an answer, every
      # answer within five seconds, the server healthy at the end.
      - name: Bad input at every route
        run: node scripts/fuzz-routes.mjs http://localhost:3000

      # All that junk, and the database must still pass every rule.
      - name: Database still sound
        run: node scripts/db-check.mjs
