name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run irrelevant, so cancel it rather
# than paying for both and waiting on the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      # CI-only value. Real deployments must set their own; the app refuses to
      # start in production without one.
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, and its postinstall generates
      # the Prisma client the typecheck depends on.
      - name: Install
        run: npm ci

      # A known high or critical vulnerability in anything that ships fails the
      # build. The production audit found a critical Next.js advisory that
      # nothing had flagged; this is what flags the next one.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      # Errors fail the build; the handful of warnings are documented in
      # eslint.config.mjs and are deliberate, so they are visible in the log
      # without blocking.
      - name: Lint
        run: npm run lint

      # Contrast (WCAG and APCA) in Day and Night, what each colour means, the
      # off switch and field edges, and the person colours under colour
      # blindness (RULES C1 to C7). Every rule must pass.
      - name: Colour rules
        run: STRICT=1 node scripts/colour-check.mjs

      - name: Unit tests
        run: npm test

      # Also applies migrations, which creates the SQLite database the smoke
      # test then runs against.
      - name: Build
        run: npm run build

      # The end-to-end pass is the one that would catch a broken balance or a
      # hole in access control, so it runs against a real server over real
      # HTTP rather than against mocks.
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://localhost:3000

      # Every action tried as every kind of person: owner, member, someone who
      # left, a stranger, a friend and someone signed out.
      - name: Permission table
        run: node scripts/permissions.mjs http://localhost:3000

      # The browser checks drive the real UI: the split editors, settling up,
      # the offline outbox, the service worker's update lifecycle, and that the
      # Content-Security-Policy blocks nothing the app itself needs.
      - name: Install a browser
        run: npx playwright install --with-deps chromium

      # The scripts a phone downloads to show Home and a group, compressed,
      # within their limits: Home 312 KB, a group 333 KB (RULES S1).
      - name: Download size
        run: STRICT=1 node scripts/size-report.mjs http://localhost:3000

      - name: UI checks
        run: node scripts/ui-check.mjs http://localhost:3000

      - name: PWA checks
        run: node scripts/pwa-check.mjs http://localhost:3000

      # Offline edits and deletes, two people changing the same expense, a
      # change refused when it arrives, an update while typing, and a second
      # phone catching up.
      - name: Offline and two-phone checks
        run: node scripts/offline-check.mjs http://localhost:3000

      # Every screen, form and panel on an iPhone-sized screen: tap areas of
      # 44 points, 200% text and zoom, the notch and home bar, and the
      # keyboard over every form, and axe in Day and Night (RULES R2 to R6,
      # A1, A4).
      - name: Phone and accessibility checks
        run: STRICT=1 node scripts/phone-check.mjs http://localhost:3000 phone-check

      # A cold start on a slow phone network, opening with no connection,
      # and nothing moving with Reduce Motion on (RULES R5, A5).
      - name: Slow, offline and Reduce Motion checks
        run: node scripts/network-check.mjs http://localhost:3000 network-check

      # The main screens, panels and states in Day and Night, compared with
      # the approved pictures in tests/screens (RULES L4). Fixed data and a
      # held clock, so only a change to the looks moves a pixel.
      - name: Picture comparison
        run: node scripts/screen-pictures.mjs http://localhost:3000 screen-pictures

      # When the looks changed on purpose, the new pictures to approve are
      # here (new/), with each change marked in red (diff/).
      - name: Keep the pictures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screen-pictures
          path: screen-pictures
          retention-days: 14

      # After everything above has written to it, the database must still pass
      # every rule: undamaged, nothing pointing at a missing row, every bill's
      # shares and payers adding up. Read-only, counts only.
      - name: Database still sound
        run: node scripts/db-check.mjs

  # Mutation testing on the money code (RULES.md M12): Stryker plants small
  # mistakes in split.ts, balances.ts and money.ts, one at a time, and the
  # job fails if the tests catch fewer than 85% of them. Its own job, so it
  # runs beside `verify` rather than after it.
  mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Mutation testing
        run: npx stryker run
        env:
          # The random money checks repeat once per planted mistake, so they
          # run fewer cases here than in `npm test`.
          MONEY_RUNS: 300

  # The suites `verify` has no room for (RULES Q1, Q3; findings item 17): the
  # money audits, the Splitwise features, every panel by keyboard at computer
  # and phone size, what a screen reader is told, long names and amounts, and
  # the phone checks again in Safari's engine. Its own job, so it runs beside
  # `verify` rather than after it.
  suites:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real
      # These suites sign up hundreds of people from one address; `verify`
      # already checks the limits themselves.
      DIVVY_RATE_LIMIT_SCALE: "1000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Safari's engine drops the app's Secure cookie over plain http, so it
      # reaches the server through a local https relay with a throwaway
      # certificate.
      - name: Start server
        run: |
          npm start &
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" 2>/dev/null
          node scripts/https-relay.mjs 3443 3000 "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/cert.pem" &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/ && curl -skf -o /dev/null https://localhost:3443/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      # 250 random steps (every split mode, several payers, other currencies,
      # edits, deletes, restores, payments), checking after each that the
      # balances add up everywhere they're shown; then the edge cases and the
      # Splitwise features over the API (RULES M1, M8).
      - name: Money audits
        run: |
          npx tsx scripts/audit-invariants.ts http://localhost:3000
          npx tsx scripts/audit-edges.ts http://localhost:3000
          npx tsx scripts/audit-features.ts http://localhost:3000

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      # A group's usual split, paying in another currency, importing a
      # Splitwise export and reading a receipt photo.
      - name: Feature checks
        run: node scripts/ui-features.mjs http://localhost:3000

      # Every panel by keyboard: focus moves in, Tab stays inside, Escape
      # closes it, focus comes back; then adding an expense and settling up
      # with keys alone (RULES A2).
      - name: Keyboard, computer size
        run: STRICT=1 node scripts/keyboard-check.mjs http://localhost:3000 reports/keyboard

      - name: Keyboard, phone size
        run: STRICT=1 WIDTH=390 node scripts/keyboard-check.mjs http://localhost:3000 reports/keyboard-phone

      # Every screen's title, language and named controls, panels that hide
      # the page behind them, and saving announced (RULES A3).
      - name: Screen reader
        run: STRICT=1 node scripts/a11y-tree.mjs http://localhost:3000 reports/screen-reader

      # 40-letter names, 9,999,999.99 in five currencies, Arabic and Hebrew,
      # at 390, 320 and 1280 wide: nothing runs off the screen.
      - name: Long text
        run: STRICT=1 node scripts/long-text.mjs http://localhost:3000 reports/long-text

      # The phone checks again in Safari's engine (RULES R2, R4, Q3).
      - name: Phone checks in Safari's engine
        run: STRICT=1 ENGINES=webkit BASE_WEBKIT=https://localhost:3443 node scripts/phone-check.mjs http://localhost:3000 reports/phone-webkit

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suites
          path: reports
          retention-days: 14

  # Every control on every screen, tapped from a freshly loaded screen: none
  # may do nothing (an overlay in the way, a handler that returns without a
  # word). The slowest suite, so it has a job of its own.
  buttons:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real
      DIVVY_RATE_LIMIT_SCALE: "1000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Every button does something
        run: node scripts/button-audit.mjs http://localhost:3000

  # Smoothness (RULES S2, MOTION-SPEC 8): every flow recorded three times with
  # the processor slowed 4x, the middle of the three kept per flow. GitHub's
  # machines are the same kind every run, so these numbers can be compared
  # from one change to the next; a laptop's numbers drift through a day. For now it
  # reports (the table is on the run's summary page) without failing, while
  # the late frames it finds are fixed; then it gets STRICT=1.
  smoothness:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      # On a pull request, main as it stands is built and served beside the
      # change, and the two are recorded in turns on this one machine: GitHub
      # hands each job a different machine, so one job's numbers can't be
      # compared with another's (PERF-BASELINE 30). Outside the checkout, so
      # the change's build never sees main's files.
      - name: Build main beside it
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          git worktree add ../main FETCH_HEAD
          cd ../main
          npm ci
          npm run build

      - name: Start main's server
        if: github.event_name == 'pull_request'
        run: |
          (cd ../main && npx next start --port 3001 &)
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3001/; then
              echo "main's server up"
              exit 0
            fi
            sleep 1
          done
          echo "main's server did not start within 30s"
          exit 1

      - name: Install a browser
        run: npx playwright install --with-deps chromium

      - name: Smoothness
        env:
          COMPARE: ${{ github.event_name == 'pull_request' && 'http://localhost:3001' || '' }}
          RUNS: ${{ github.event_name == 'pull_request' && '5' || '3' }}
        run: node scripts/smoothness.mjs http://localhost:3000 smoothness

      # Each run's numbers and every late frame with the code that ran in it.
      - name: Keep the recordings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoothness
          path: smoothness
          retention-days: 14

  # The image is how this actually gets deployed, so it is worth knowing that it
  # still builds — a Dockerfile that only gets exercised at deploy time is a
  # Dockerfile that breaks at deploy time. Separate job because it shares
  # nothing with `verify` and there is no reason to make either wait.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The smoke script is dependency-free but not version-free; pin the
      # runtime rather than inherit whatever the runner image ships this month.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: divvy:ci
          build-args: BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; starting it proves the entrypoint applies
      # migrations to an empty volume and the server answers on a real port.
      - name: Boot it against an empty volume
        run: |
          docker run -d --name divvy \
            -p 3000:3000 \
            -e DIVVY_SECRET=ci-only-secret-not-used-for-anything-real \
            -v divvy-ci-data:/data \
            divvy:ci
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "container up"
              exit 0
            fi
            sleep 2
          done
          echo "container did not answer within 120s"
          docker logs divvy
          exit 1

      # The same end-to-end pass the non-container job runs, against the image
      # that will actually be deployed.
      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://localhost:3000

      - name: Refuse to start without a secret
        run: |
          if docker run --rm -v divvy-ci-data:/data divvy:ci; then
            echo "the container started with no DIVVY_SECRET; it must not"
            exit 1
          fi
          echo "refused, as it should"

      # Litestream is the off-site backup, and nothing else here runs it. One
      # container backs up to a folder while the smoke test writes people,
      # groups and expenses; a second starts on an empty disk and must restore
      # every row from that folder, then serve the app. The folder stands in
      # for the storage bucket the live site uses.
      - name: Back up and restore with Litestream
        run: |
          docker run --rm --entrypoint litestream divvy:ci version
          docker run --rm -v divvy-ci-replica:/replica --entrypoint chown divvy:ci node:node /replica
          run() {
            docker run -d --name "$1" -p "$2":3000 \
              -e DIVVY_SECRET=ci-only-secret-not-used-for-anything-real \
              -e LITESTREAM_REPLICA_URL=file:///replica/divvy \
              -v "divvy-ci-$1":/data -v divvy-ci-replica:/replica divvy:ci
            for i in $(seq 1 60); do
              curl -sf -o /dev/null "http://localhost:$2/" && return 0
              sleep 2
            done
            docker logs "$1"; return 1
          }
          rows() {
            docker run --rm -v "divvy-ci-$1":/data --entrypoint node divvy:ci -e '
              const db = new (require("better-sqlite3"))("/data/divvy.db");
              console.log(["Person", "Group", "Expense", "Settlement", "Activity"]
                .map((t) => t + " " + db.prepare(`select count(*) n from "${t}"`).get().n).join(", "));'
          }
          run primary 3001
          node scripts/smoke.mjs http://localhost:3001
          sleep 5
          docker stop -t 30 primary
          before="$(rows primary)"
          run restored 3002
          docker logs restored 2>&1 | grep "Restoring /data/divvy.db"
          docker stop -t 30 restored
          after="$(rows restored)"
          echo "backed up: $before"
          echo "restored:  $after"
          case "$before" in "Person 0"*) echo "the smoke test wrote nothing"; exit 1 ;; esac
          [ "$before" = "$after" ] || { echo "the restore lost rows"; exit 1; }

  # Bad input at every route (RULES V1, V2): about 30,000 calls, signed out and
  # signed in, with junk in the path, the query and the body. Never a 500,
  # nothing internal in an answer, every answer within five seconds, and the
  # database still sound afterwards. About two minutes here. Its own job, so
  # it runs beside `verify` rather than after it.
  fuzz:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real
      # Every allowance times 1,000, so the calls test validation, not the
      # rate limits.
      DIVVY_RATE_LIMIT_SCALE: "1000"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      - name: Bad input at every route
        run: node scripts/fuzz-routes.mjs http://localhost:3000

      - name: Database still sound
        run: node scripts/db-check.mjs
