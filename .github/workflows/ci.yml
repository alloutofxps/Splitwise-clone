name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to a PR makes the first run irrelevant, so cancel it rather
# than paying for both and waiting on the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:./dev.db
      # CI-only value. Real deployments must set their own; the app refuses to
      # start in production without one.
      DIVVY_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly the lockfile, and its postinstall generates
      # the Prisma client the typecheck depends on.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Errors fail the build; the handful of warnings are documented in
      # eslint.config.mjs and are deliberate, so they are visible in the log
      # without blocking.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Also applies migrations, which creates the SQLite database the smoke
      # test then runs against.
      - name: Build
        run: npm run build

      # The end-to-end pass is the one that would catch a broken balance or a
      # hole in access control, so it runs against a real server over real
      # HTTP rather than against mocks.
      - name: Start server
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "server did not start within 30s"
          exit 1

      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://localhost:3000

  # The image is how this actually gets deployed, so it is worth knowing that it
  # still builds — a Dockerfile that only gets exercised at deploy time is a
  # Dockerfile that breaks at deploy time. Separate job because it shares
  # nothing with `verify` and there is no reason to make either wait.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The smoke script is dependency-free but not version-free; pin the
      # runtime rather than inherit whatever the runner image ships this month.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: divvy:ci
          build-args: BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; starting it proves the entrypoint applies
      # migrations to an empty volume and the server answers on a real port.
      - name: Boot it against an empty volume
        run: |
          docker run -d --name divvy \
            -p 3000:3000 \
            -e DIVVY_SECRET=ci-only-secret-not-used-for-anything-real \
            -v divvy-ci-data:/data \
            divvy:ci
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "container up"
              exit 0
            fi
            sleep 2
          done
          echo "container did not answer within 120s"
          docker logs divvy
          exit 1

      # The same end-to-end pass the non-container job runs, against the image
      # that will actually be deployed.
      - name: End-to-end smoke test
        run: node scripts/smoke.mjs http://localhost:3000

      - name: Refuse to start without a secret
        run: |
          if docker run --rm -v divvy-ci-data:/data divvy:ci; then
            echo "the container started with no DIVVY_SECRET; it must not"
            exit 1
          fi
          echo "refused, as it should"
